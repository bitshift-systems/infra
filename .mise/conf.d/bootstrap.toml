[tasks."bootstrap:apply"]
description = "Apply Talos configuration to the cluster"
secrets = ["WG_LON1_PRIVATE_KEY"]
run = '''
topf --topfconfig "{{ config_root }}/talos/topf.yaml" apply --auto-bootstrap --confirm=false
'''

[tasks."bootstrap:base"]
secrets = [
  "FLUX_GHA_CLIENT_ID_B64",
  "FLUX_GHA_INSTALLATION_ID_B64",
  "FLUX_GHA_PRIVATE_KEY_B64",
  "OP_CREDENTIALS_B64",
  "OP_CONNECT_TOKEN",
]
run = '''
kustomize build "{{ config_root }}/bootstrap/kustomize/apps" | envsubst | kubectl apply --server-side --force-conflicts -f -
helmfile -f "{{ config_root }}/bootstrap/helmfile/crds.yaml" template -q | yq ea -e 'select(.kind == "CustomResourceDefinition")' | kubectl apply --server-side --force-conflicts -f -
'''
