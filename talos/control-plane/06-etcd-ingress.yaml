---
# etcd client and peer traffic between control-plane nodes.
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: etcd-ingress
portSelector:
  ports:
    - 2379-2380
  protocol: tcp
ingress:
  - subnet: 57.129.192.57/32 # lon1
  - subnet: 2001:41d0:801:2000::9628/128 # lon1
  - subnet: 198.244.188.136/32 # lon2
  - subnet: 2001:41d0:801:2000::4b41/128 # lon2
