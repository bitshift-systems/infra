---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  chartRef:
    kind: OCIRepository
    name: cert-manager
  interval: 1h
  values:
    crds:
      enabled: true
    config:
      apiVersion: controller.config.cert-manager.io/v1alpha1
      kind: ControllerConfiguration
      gatewayAPI:
        enabled: true
    dns01RecursiveNameservers: https://1.1.1.1:443/dns-query,https://1.0.0.1:443/dns-query
    dns01RecursiveNameserversOnly: true
    prometheus:
      servicemonitor:
        enabled: true
    webhook:
      replicaCount: 2
      podLabels:
        ingress.netpol.bitshift.systems/o11y: allow
        egress.netpol.bitshift.systems/apiserver: allow
        ingress.netpol.bitshift.systems/apiserver: allow
      podDisruptionBudget:
        enabled: true
    cainjector:
      podLabels:
        ingress.netpol.bitshift.systems/o11y: allow
        egress.netpol.bitshift.systems/apiserver: allow
    podLabels:
      ingress.netpol.bitshift.systems/o11y: allow
      egress.netpol.bitshift.systems/apiserver: allow
      egress.netpol.bitshift.systems/internet-https: allow
      egress.netpol.bitshift.systems/cloudflare-dns: allow
