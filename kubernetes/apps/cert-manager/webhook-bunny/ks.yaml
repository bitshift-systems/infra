---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-webhook-bunny
spec:
  dependsOn:
    - name: cert-manager
  interval: 12h
  path: ./kubernetes/apps/cert-manager/webhook-bunny/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: cert-manager
  timeout: 5m
  wait: true
