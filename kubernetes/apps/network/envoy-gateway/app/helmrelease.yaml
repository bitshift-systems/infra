---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
  namespace: network
spec:
  chartRef:
    kind: OCIRepository
    name: envoy-gateway
  interval: 30m
  values:
    deployment:
      pod:
        labels:
          egress.netpol.bitshift.systems/apiserver: allow
          ingress.netpol.bitshift.systems/host: allow
          ingress.netpol.bitshift.systems/o11y: allow
          ingress.netpol.bitshift.systems/apiserver: allow

    certgen:
      job:
        pod:
          labels:
            egress.netpol.bitshift.systems/apiserver: allow

    config:
      envoyGateway:
        extensionApis:
          enableBackend: true
        provider:
          type: Kubernetes
          kubernetes:
            deploy:
              type: GatewayNamespace
