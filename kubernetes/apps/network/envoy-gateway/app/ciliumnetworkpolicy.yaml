---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Managed Envoy proxies connect to the controller xDS server on 18000.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: np-i-a-envoy-gateway
  namespace: network
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: gateway-helm
      app.kubernetes.io/instance: envoy-gateway
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/managed-by: envoy-gateway
            app.kubernetes.io/name: envoy
          matchExpressions:
            - key: k8s:io.kubernetes.pod.namespace
              operator: Exists
      toPorts:
        - ports:
            - port: '18000'
              protocol: TCP
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Managed Envoy proxies connect to the controller xDS server on 18000.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: np-e-a-envoy-gateway
  namespace: network
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: proxy
      app.kubernetes.io/name: envoy
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: gateway-helm
            app.kubernetes.io/instance: envoy-gateway
      toPorts:
        - ports:
            - port: '18000'
              protocol: TCP
