---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app bunny-dns
  namespace: network
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    fullnameOverride: *app
    provider:
      name: webhook
      webhook:
        image:
          repository: ghcr.io/contaimlabs/external-dns-bunny-webhook
          tag: v0.3.0
      env:
        - name: BUNNY_API_KEY
          valueFrom:
            secretKeyRef:
              name: &secret external-dns-bunny
              key: BUNNY_API_KEY
    extraArgs:
      - --crd-source-apiversion=externaldns.k8s.io/v1alpha1
      - --crd-source-kind=DNSEndpoint
    triggerLoopOnEvent: true
    policy: sync
    sources:
      - crd
      - gateway-httproute
    podAnnotations:
      secret.reloader.stakater.com/reload: *secret
    podLabels:
      egress.netpol.bitshift.systems/apiserver: allow
      egress.netpol.bitshift.systems/internet-https: allow
      ingress.netpol.bitshift.systems/host: allow
