---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  chartRef:
    kind: OCIRepository
    name: external-secrets
  interval: 30m
  values:
    image:
      repository: ghcr.io/external-secrets/external-secrets
    installCRDs: true
    certController:
      image:
        repository: ghcr.io/external-secrets/external-secrets
      podLabels:
        egress.netpol.bitshift.systems/apiserver: allow
        ingress.netpol.bitshift.systems/apiserver: allow
    podLabels:
      egress.netpol.bitshift.systems/apiserver: allow
      egress.netpol.bitshift.systems/internet-https: allow
    webhook:
      image:
        repository: ghcr.io/external-secrets/external-secrets
      podLabels:
        egress.netpol.bitshift.systems/apiserver: allow
        ingress.netpol.bitshift.systems/apiserver: allow
      replicaCount: 2
      podDisruptionBudget:
        enabled: true
