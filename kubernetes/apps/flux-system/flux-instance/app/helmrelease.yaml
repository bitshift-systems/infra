---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-instance
  namespace: flux-system
spec:
  chartRef:
    kind: OCIRepository
    name: flux-instance
  interval: 30m
  upgrade:
    strategy:
      name: RetryOnFailure
  values:
    instance:
      commonAnnotations:
        fluxcd.controlplane.io/reconcileArtifactEvery: 1h
      cluster:
        networkPolicy: false
      components:
        - source-controller
        - kustomize-controller
        - helm-controller
        - notification-controller
        - image-reflector-controller
        - image-automation-controller
      sync:
        kind: GitRepository
        url: https://github.com/bitshift-systems/infra.git
        ref: refs/heads/main
        path: kubernetes/apps
        interval: 1m
        pullSecret: flux-system
      resources:
        limits:
          memory: 1Gi
        requests:
          cpu: 100m
          memory: 64Mi
