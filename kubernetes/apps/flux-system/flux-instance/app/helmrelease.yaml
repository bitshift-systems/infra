---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-instance
  namespace: flux-system
spec:
  chartRef:
    kind: OCIRepository
    name: flux-instance
  interval: 30m
  upgrade:
    strategy:
      name: RetryOnFailure
  values:
    instance:
      commonAnnotations:
        fluxcd.controlplane.io/reconcileArtifactEvery: 1h
      cluster:
        networkPolicy: false
      components:
        - source-controller
        - kustomize-controller
        - helm-controller
        - notification-controller
        - image-reflector-controller
        - image-automation-controller
      sync:
        kind: GitRepository
        url: https://github.com/bitshift-systems/infra.git
        ref: refs/heads/main
        path: kubernetes/apps
        interval: 1m
        provider: github
        pullSecret: flux-system
      resources:
        limits:
          memory: 1Gi
        requests:
          cpu: 100m
          memory: 64Mi

      kustomize:
        patches:
          - # Add retry and HelmRelease defaults for all child Kustomizations.
            # This replaces spec.patches, so a ks.yaml must not set its own.
            patch: |-
              - op: add
                path: /spec/patches
                value:
                  - patch: |-
                      apiVersion: kustomize.toolkit.fluxcd.io/v1
                      kind: Kustomization
                      metadata:
                        name: _
                      spec:
                        retryInterval: 2m
                        patches:
                          - patch: |-
                              apiVersion: helm.toolkit.fluxcd.io/v2
                              kind: HelmRelease
                              metadata:
                                name: _
                              spec:
                                install:
                                  crds: CreateReplace
                                rollback:
                                  cleanupOnFail: true
                                upgrade:
                                  cleanupOnFail: true
                                  crds: CreateReplace
                                  remediation:
                                    remediateLastFailure: true
                                    retries: 2
                            target:
                              group: helm.toolkit.fluxcd.io
                              kind: HelmRelease
                    target:
                      group: kustomize.toolkit.fluxcd.io
                      kind: Kustomization
            target:
              group: kustomize.toolkit.fluxcd.io
              kind: Kustomization
              name: flux-system

          - # Increase the number of workers
            patch: |-
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --concurrent=10
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --requeue-dependency=5s
            target:
              kind: Deployment
              name: (kustomize-controller|helm-controller|source-controller)

          - # Enable in-memory kustomize builds
            patch: |-
              - op: replace
                path: /spec/template/spec/volumes/0
                value:
                  name: temp
                  emptyDir:
                    medium: Memory
            target:
              kind: Deployment
              name: kustomize-controller

          - # Enable Helm repositories caching
            patch: |-
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --helm-cache-max-size=10
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --helm-cache-ttl=60m
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --helm-cache-purge-interval=5m
            target:
              kind: Deployment
              name: source-controller

          - # Cache Secrets and ConfigMaps
            patch: |-
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --feature-gates=CacheSecretsAndConfigMaps=true
            target:
              kind: Deployment
              name: source-controller

          - # Flux near OOM detection for Helm
            patch: |-
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --feature-gates=OOMWatch=true
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --oom-watch-memory-threshold=95
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --oom-watch-interval=500ms
            target:
              kind: Deployment
              name: helm-controller

          - # Disable chart digest tracking
            patch: |-
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --feature-gates=DisableChartDigestTracking=true
            target:
              kind: Deployment
              name: helm-controller

          - # Watch configmaps and secrets attached to HelmReleases and Kustomizations
            patch: |-
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --watch-configs-label-selector=owner!=helm
            target:
              kind: Deployment
              name: (helm-controller|kustomize-controller)

          - # Cancel health checks on new Kustomizations revisions
            patch: |-
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --feature-gates=CancelHealthCheckOnNewRevision=true
            target:
              kind: Deployment
              name: kustomize-controller
