---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  chartRef:
    kind: OCIRepository
    name: flux-operator
  interval: 30m
  values:
    commonLabels:
      ingress.netpol.bitshift.systems/o11y: allow
      egress.netpol.bitshift.systems/apiserver: allow
      egress.netpol.bitshift.systems/internet-https: allow
    serviceMonitor:
      create: true
    web:
      enabled: false
    resources:
      limits:
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 64Mi
