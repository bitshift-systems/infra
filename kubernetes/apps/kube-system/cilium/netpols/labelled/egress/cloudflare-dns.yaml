---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: np-e-a-to-cloudflare-dns
spec:
  endpointSelector:
    matchLabels:
      egress.netpol.bitshift.systems/cloudflare-dns: allow
  egress:
    - toCIDR:
        # Standard resolvers used by cert-manager's DNS01 configuration.
        # https://developers.cloudflare.com/1.1.1.1/ip-addresses/
        - 1.1.1.1/32
        - 1.0.0.1/32
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "853"
              protocol: TCP
