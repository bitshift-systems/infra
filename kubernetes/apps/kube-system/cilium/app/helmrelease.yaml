---
# yaml-language-server: $schema=https://schemas.mortebrume.eu/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
spec:
  chartRef:
    kind: OCIRepository
    name: cilium
  interval: 1h
  values:
    ipam:
      mode: kubernetes
    k8sServiceHost: 127.0.0.1
    k8sServicePort: 7445
    kubeProxyReplacement: true
    ipv4NativeRoutingCIDR: 10.244.0.0/16
    ipv6NativeRoutingCIDR: fd00::/48
    ipv6:
      enabled: true

    bandwidthManager:
      enabled: true
    bpf:
      # Pods and nodes reach the gateways' externalIPs (CVE-2020-8554 guard; only admins create Services).
      disableExternalIPMitigation: true
      hostLegacyRouting: true
      masquerade: true
      preallocateMaps: false
    bpfClockProbe: true
    MTU: 1420
    rollOutCiliumPods: true
    resources:
      requests:
        cpu: 300m
        memory: 384Mi
    routingMode: native
    dashboards:
      enabled: true

    # disable envoy
    envoy:
      enabled: false
    ingressController:
      enabled: false

    # enable hubble
    hubble:
      enabled: true
      relay:
        enabled: true
      ui:
        enabled: true
        podLabels:
          egress.netpol.bitshift.systems/apiserver: allow
          ingress.netpol.bitshift.systems/internal: allow

    # single-replica operator for performance
    operator:
      replicas: 1
      rollOutPods: true
      dashboards:
        enabled: true
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true

    # needed for talos
    securityContext:
      capabilities:
        ciliumAgent: [CHOWN, KILL, NET_ADMIN, NET_RAW, IPC_LOCK, SYS_ADMIN, SYS_RESOURCE, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
        cleanCiliumState: [NET_ADMIN, SYS_ADMIN, SYS_RESOURCE]
    cgroup:
      autoMount:
        enabled: true
      hostRoot: /sys/fs/cgroup
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
        trustCRDsExist: true
