---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coredns
  namespace: kube-system
spec:
  chartRef:
    kind: OCIRepository
    name: coredns
  interval: 1h
  values:
    fullnameOverride: coredns
    image:
      repository: mirror.gcr.io/coredns/coredns
    replicaCount: 2
    k8sAppLabelOverride: kube-dns
    podLabels:
      ingress.netpol.bitshift.systems/o11y: allow
      egress.netpol.bitshift.systems/apiserver: allow
      egress.netpol.bitshift.systems/cloudflare-dns: allow
    serviceAccount:
      create: true
    service:
      name: kube-dns
      clusterIP: 10.96.0.10
      clusterIPs:
        - 10.96.0.10
        - fd01::a
      ipFamilies:
        - IPv4
        - IPv6
      ipFamilyPolicy: RequireDualStack
      trafficDistribution: PreferSameZone
    servers:
      - zones:
          - zone: .
            scheme: dns://
            use_tcp: true
        port: 53
        plugins:
          - name: errors
          - name: health
            configBlock: |-
              lameduck 5s
          - name: ready
          - name: kubernetes
            parameters: cluster.local in-addr.arpa ip6.arpa
            configBlock: |-
              pods verified
              fallthrough in-addr.arpa ip6.arpa
          # No autopath: it answers the search-path name with a CNAME, and
          # Cilium keys toFQDNs on the query name, so every FQDN policy in the
          # cluster would match nothing. cilium/cilium#20191.
          - name: forward
            parameters: . tls://1.1.1.1 tls://1.0.0.1
            configBlock: |-
              tls_servername cloudflare-dns.com
          - name: cache
            configBlock: |-
              prefetch 20
              serve_stale
          - name: loop
          - name: reload
          - name: loadbalance
          - name: prometheus
            parameters: 0.0.0.0:9153
          - name: log
            configBlock: |-
              class error
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
    priorityClassName: system-cluster-critical
    # The chart defaults to a 100m CPU limit, which throttles cluster DNS.
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: null
        memory: 256Mi
    podDisruptionBudget:
      maxUnavailable: 1
    prometheus:
      service:
        enabled: true
      monitor:
        enabled: true
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            k8s-app: kube-dns
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            k8s-app: kube-dns
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
